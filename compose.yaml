services:
  kwok-cluster:
    container_name: evaluator-kwok-cluster
    restart: always
    image: registry.k8s.io/kwok/cluster:v0.6.1-k8s.v1.30.4
    pull_policy: if_not_present
    ports:
      - "8080:8080"
      - "2379:2379"
    volumes:
      - kwok-etcd-data:/var/lib/etcd
      - ./config/kwok-cluster/kwok.yaml:/root/.kwok/kwok.yaml

  default-scheduler:
    container_name: evaluator-default-scheduler
    restart: always
    image: registry.k8s.io/kube-scheduler:v1.32.5
    pull_policy: if_not_present
    command:
      - kube-scheduler
      - --config=/config.yaml
      - --secure-port=10259
    environment:
      - KUBECONFIG=/kubeconfig.yaml
    volumes:
      - ./config/kwok-cluster/kubeconfig.yaml:/kubeconfig.yaml
      - ./config/default-scheduler/scheduler-config.yaml:/config.yaml
    network_mode: "service:kwok-cluster"
    depends_on:
      - kwok-cluster

  victoriametrics:
    container_name: evaluator-victoriametrics
    restart: always
    image: quay.io/victoriametrics/victoria-metrics:stable
    pull_policy: if_not_present
    command:
      - -storageDataPath=/var/lib/victoria-metrics
      - -retentionPeriod=365d
    ports:
      - "8428:8428"
    volumes:
      - victoriametrics-data:/var/lib/victoria-metrics

  grafana:
    container_name: evaluator-grafana
    restart: always
    image: grafana/grafana
    pull_policy: if_not_present
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=password
    volumes:
      - grafana-data:/var/lib/grafana
      - ./config/grafana:/etc/grafana/provisioning
    depends_on:
      - victoriametrics

volumes:
  kwok-etcd-data:
  victoriametrics-data:
  grafana-data:
