services:
  kwok-cluster:
    container_name: evaluator-kwok-cluster
    restart: always
    image: registry.k8s.io/kwok/cluster:v0.6.1-k8s.v1.30.4
    pull_policy: if_not_present
    ports:
      - "8080:8080"
      - "2379:2379"
    volumes:
      - kwok-etcd-data:/var/lib/etcd
      - ../config/kwok-cluster/kwok.yaml:/root/.kwok/kwok.yaml

  default-scheduler:
    container_name: evaluator-default-scheduler
    restart: always
    image: registry.k8s.io/kube-scheduler:v1.32.5
    pull_policy: if_not_present
    command:
      - kube-scheduler
      - --config=/config.yaml
      - --secure-port=10259
    environment:
      - KUBECONFIG=/kubeconfig.yaml
    volumes:
      - ../config/kwok-cluster/kubeconfig.yaml:/kubeconfig.yaml
      - ../config/default-scheduler/scheduler-config.yaml:/config.yaml
    network_mode: "service:kwok-cluster"
    depends_on:
      - kwok-cluster

volumes:
  kwok-etcd-data:
