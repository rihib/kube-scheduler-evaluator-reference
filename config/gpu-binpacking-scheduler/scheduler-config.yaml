apiVersion: kubescheduler.config.k8s.io/v1
kind: KubeSchedulerConfiguration
leaderElection:
  leaderElect: false
profiles:
- schedulerName: gpu-binpacking-utilization
  plugins:
    score:
      disabled:
      - name: "*"
      enabled:
      - name: GPUUtilizationBinPacking
        weight: 1
- schedulerName: gpu-binpacking-freecount
  plugins:
    score:
      disabled:
      - name: "*"
      enabled:
      - name: GPUFreeCountBinPacking
        weight: 1
